spring:
  datasource:
    url: jdbc:h2:mem:food_delivery_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  flyway:
    enabled: false

app:
  security:
    jwt:
      secret: test-secret-key-that-is-at-least-32-bytes-long
      expiration-seconds: 3600
      issuer: https://food-delivery-api.local
